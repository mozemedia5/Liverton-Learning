<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    
    <!-- Primary metadata: learn.liverton.com is canonical; the Vercel URL remains supported. -->
    <title>Liverton Learning — Modern LMS &amp; e-Learning Marketplace</title>
    <meta name="title" content="Liverton Learning — Modern LMS &amp; e-Learning Marketplace" />
    <meta name="description" content="Liverton Learning is the modern learning platform for students, teachers, parents and schools: courses, live lessons, quizzes, collaborative Liv Teams workspaces, documents and AI-powered study help." />
    <meta name="author" content="Liverton Learning" />
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://learn.liverton.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://learn.liverton.com/" />
    <meta property="og:title" content="Liverton Learning — Modern LMS &amp; e-Learning Marketplace" />
    <meta property="og:description" content="A connected learning platform for students, teachers, parents, schools, and education-focused organizations." />
    <meta property="og:image" content="https://learn.liverton.com/logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Liverton Learning logo" />
    <meta property="og:site_name" content="Liverton Learning" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@livertonlearn" />
    <meta name="twitter:url" content="https://learn.liverton.com/" />
    <meta name="twitter:title" content="Liverton Learning — Modern LMS &amp; e-Learning Marketplace" />
    <meta name="twitter:description" content="A connected learning platform for students, teachers, parents, schools, and education-focused organizations." />
    <meta name="twitter:image" content="https://learn.liverton.com/logo.png" />
    <meta name="twitter:image:alt" content="Liverton Learning logo" />

    <!-- Organization and website structured data for search and AI systems. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "EducationalOrganization",
          "@id": "https://learn.liverton.com/#organization",
          "name": "Liverton Learning",
          "url": "https://learn.liverton.com/",
          "logo": "https://learn.liverton.com/logo.png",
          "description": "A connected learning platform for students, teachers, parents, schools, and education-focused organizations.",
          "sameAs": ["https://liverton-learning.vercel.app/"]
        },
        {
          "@type": "WebSite",
          "@id": "https://learn.liverton.com/#website",
          "url": "https://learn.liverton.com/",
          "name": "Liverton Learning",
          "publisher": {"@id": "https://learn.liverton.com/#organization"},
          "inLanguage": "en"
        }
      ]
    }
    </script>

    <!-- Pinterest Domain Verification (Optional, boilerplate placeholder) -->
    <meta name="pinterest" content="nopin" description="Please do not pin private dashboard views" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Liverton" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="1024x1024" href="/icons/liverton-icon-1024.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/liverton-icon-192.png" />
    <link rel="icon" type="image/png" sizes="96x96"   href="/icons/liverton-icon-96.png" />
    <link rel="icon" type="image/png" sizes="48x48"   href="/icons/liverton-icon-48.png" />
    <link rel="shortcut icon" type="image/png" href="/icons/liverton-icon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/liverton-icon-180.png" />
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#10b981" />
    <meta name="msapplication-TileImage" content="/icons/liverton-icon-144.png" />

    <!-- Manifest (generated by vite-plugin-pwa at build time) -->
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
