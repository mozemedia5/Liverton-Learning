<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    
    <!-- Primary Meta Tags -->
    <title>Liverton Learning - Modern LMS & e-Learning Marketplace</title>
    <meta name="title" content="Liverton Learning - Modern LMS & e-Learning Marketplace" />
    <meta name="description" content="Liverton Learning is a premium educational platform connecting students, teachers, schools, and parents for seamless e-learning, live lessons, quizzes, and tracking." />
    <meta name="keywords" content="Liverton Learning, e-learning, LMS, learning management system, online classes, educational platform, curriculum tracker, live classes, student management" />
    <meta name="author" content="Liverton Learning" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://liverton-learning.vercel.app/" />

    <!-- Open Graph / Facebook / WhatsApp link preview / Pinterest / Instagram -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://liverton-learning.vercel.app/" />
    <meta property="og:title"       content="Liverton Learning - Empowering Education Everywhere" />
    <meta property="og:description" content="Join our premium learning environment. Liverton Learning bridges students, teachers, and institutions with cutting-edge tools, live sessions, and personalized progress analysis." />
    <meta property="og:image"       content="https://liverton-learning.vercel.app/logo.png" />
    <meta property="og:image:width"  content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:type"   content="image/png" />
    <meta property="og:image:alt"    content="Liverton Learning Brand Logo" />
    <meta property="og:site_name"   content="Liverton Learning" />
    <meta property="og:locale"      content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@livertonlearn" />
    <meta name="twitter:url"         content="https://liverton-learning.vercel.app/" />
    <meta name="twitter:title"       content="Liverton Learning - Empowering Education Everywhere" />
    <meta name="twitter:description" content="Join our premium learning environment. Liverton Learning bridges students, teachers, and institutions with cutting-edge tools." />
    <meta name="twitter:image"       content="https://liverton-learning.vercel.app/logo.png" />
    <meta name="twitter:image:alt"   content="Liverton Learning Brand Logo" />

    <!-- Structured data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Liverton Learning",
      "url": "https://liverton-learning.vercel.app/",
      "logo": "https://liverton-learning.vercel.app/logo.png",
      "description": "Liverton Learning is a premium educational platform connecting students, teachers, schools, and parents for seamless e-learning, live lessons, quizzes, and tracking.",
      "sameAs": []
    }
    </script>

    <!-- Pinterest Domain Verification (Optional, boilerplate placeholder) -->
    <meta name="pinterest" content="nopin" description="Please do not pin private dashboard views" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Liverton" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="96x96"   href="/icons/icon-96x96.png" />
    <link rel="icon" type="image/png" sizes="48x48"   href="/icons/icon-48x48.png" />
    <link rel="shortcut icon" type="image/png" href="/icons/icon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#10b981" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />

    <!-- Manifest (generated by vite-plugin-pwa at build time) -->
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
